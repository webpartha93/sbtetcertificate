<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Verification Portal</title>
  <meta name="description"
    content="Verify your diploma or course certificate by entering your name and registration number." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Animated background particles -->
  <div class="bg-animation">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- ===== LOGIN / VERIFY SECTION ===== -->
  <section id="verify-section" class="page active">
    <div class="container">

      <!-- Header -->
      <div class="portal-header">
        <div class="logo-ring">
          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="30" cy="30" r="28" stroke="url(#grad1)" stroke-width="2.5" />
            <path d="M20 30l7 7 13-14" stroke="url(#grad1)" stroke-width="3" stroke-linecap="round"
              stroke-linejoin="round" />
            <defs>
              <linearGradient id="grad1" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
                <stop stop-color="#c9922a" />
                <stop offset="0.5" stop-color="#e8b84b" />
                <stop offset="1" stop-color="#4a90d9" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="portal-title">Certificate Verification</h1>
        <p class="portal-subtitle">Enter your credentials to retrieve your official certificate</p>
      </div>

      <!-- Card -->
      <div class="card">
        <form id="verify-form" novalidate>

          <div class="form-group">
            <label for="student-name" class="form-label">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <input type="text" id="student-name" name="student-name" class="form-input"
                placeholder="e.g. PRABHAS KUMAR PUSTI" autocomplete="name" required />
            </div>
            <span class="field-error" id="name-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-number" class="form-label">Registration Number</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
              </span>
              <input type="text" id="reg-number" name="reg-number" class="form-input" placeholder="e.g. 0033/26/11"
                autocomplete="off" required />
            </div>
            <span class="field-error" id="reg-error"></span>
          </div>

          <!-- Alert box -->
          <div class="alert-box" id="alert-box" role="alert" aria-live="polite"></div>

          <button type="submit" class="btn-verify" id="verify-btn">
            <span class="btn-text">Verify Certificate</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

        </form>

        <p class="help-text">Having trouble? Contact your institution's examination board.</p>
      </div>

    </div>
  </section>

  <!-- ===== CERTIFICATE RESULT SECTION ===== -->
  <section id="result-section" class="page">
    <div class="container result-container">

      <div class="result-header">
        <div class="success-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
        </div>
        <h2 class="result-title">Certificate Verified!</h2>
        <p class="result-subtitle" id="result-name-display"></p>
        <p class="result-reg" id="result-reg-display"></p>
      </div>

      <!-- Certificate Image -->
      <div class="certificate-frame">
        <div class="cert-shine"></div>
        <img id="certificate-img" src="" alt="Certificate" class="certificate-img" />
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <!-- <a id="download-btn" href="#" download class="btn-download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download Certificate
        </a> -->
        <button id="back-btn" class="btn-back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12" />
            <polyline points="12 19 5 12 12 5" />
          </svg>
          Back to Verification
        </button>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
